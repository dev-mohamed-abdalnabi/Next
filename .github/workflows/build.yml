name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Assemble Project Structure & Generate Icons
        run: |
          # 1. إنشاء بنية مجلدات أندرويد
          mkdir -p app/src/main/java/app/flowplay
          mkdir -p app/src/main/res/font
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          # 2. نقل ملفات الكود والخطوط وإعدادات البناء
          cp *.kt app/src/main/java/app/flowplay/ 2>/dev/null || true
          cp *.ttf app/src/main/res/font/ 2>/dev/null || true
          cp app-build.gradle.kts app/build.gradle.kts 2>/dev/null || true

          # 3. إنشاء خلفية الأيقونة (أسود داكن مطابِق)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0A0B0E"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          # 4. إنشاء الرسمة الأمامية (المثلث المتموج بلونيه الأبيض والأزرق الرمادي)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- النصف العلوي: أبيض ناصع بحواف منحنية وموجة سفلية -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M38,30.5
                                    C38,28.8 39.8,27.8 41.2,28.7
                                    L76.5,52.4
                                    C77.8,53.2 77.4,54.2 76.2,54.5
                                    C69.5,55.5 61.5,51.5 53,50.8
                                    C45.5,50.2 41,52.8 38,53.2
                                    Z" />

              <!-- النصف السفلي: أزرق رمادي معدني (#8E9EAF) بالموجة العلوية -->
              <path
                  android:fillColor="#8E9EAF"
                  android:pathData="M38,56.8
                                    C41,56.2 45.5,53.8 53,54.4
                                    C61.5,55.2 69.5,59 76.2,56.2
                                    L41.2,79.2
                                    C39.8,80.2 38,79.2 38,77.5
                                    Z" />
          </vector>
          EOF

          # 5. إنشاء ملفات ربط الأيقونة التكيفية
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # 6. التأكد من وجود ملف AndroidManifest.xml وضبط الأيقونة
          if [ -f "AndroidManifest.xml" ]; then
              cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          else
              cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />

              <application
                  android:label="Next"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".VideoActivity"
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF
          fi

          # 7. التأكد من وجود مفتاح التوقيع flow.jks
          if [ -f "flow.jks" ]; then
              cp flow.jks app/flow.jks
          else
              keytool -genkeypair -v -keystore app/flow.jks -alias flow -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass flowplayer2026 -keypass flowplayer2026 -dname "CN=FlowPlay, OU=App, O=Flow, L=City, S=State, C=US"
          fi

          # 8. توليد Gradle Wrapper إذا لم يكن موجوداً
          if [ ! -f "gradlew" ]; then
              gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Next-APK
          path: app/build/outputs/apk/release/*.apk
