name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Assemble Project Structure & Generate All Resources
        run: |
          # 1. إنشاء كافة المجلدات المطلوبة للمشروع والموارد
          mkdir -p app/src/main/java/app/flowplay
          mkdir -p app/src/main/res/font
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night

          # 2. نقل ملفات الكود والخطوط وإعدادات البناء
          cp *.kt app/src/main/java/app/flowplay/ 2>/dev/null || true
          cp *.ttf app/src/main/res/font/ 2>/dev/null || true
          cp app-build.gradle.kts app/build.gradle.kts 2>/dev/null || true
          cp proguard-rules.pro app/proguard-rules.pro 2>/dev/null || touch app/proguard-rules.pro

          # تصحيح أي استدعاءات برمجية تلقائياً
          sed -i 's/MiniPlayer { np = true }/MiniPlayer(onOpen = { np = true })/g' app/src/main/java/app/flowplay/UI.kt 2>/dev/null || true
          sed -i 's/LocalClipboardManager\.current\.getText()/clip.getText()/g' app/src/main/java/app/flowplay/Video.kt 2>/dev/null || true

          # 3. إنشاء الثيمات Theme.Flow و Theme.Flow.Video المطلوبة في المانيفست
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Flow" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
              <style name="Theme.Flow.Video" parent="Theme.Flow">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
              <style name="Theme.Flow.Quick" parent="Theme.Flow">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:backgroundDimEnabled">true</item>
                  <item name="android:windowAnimationStyle">@android:style/Animation.Translucent</item>
              </style>
          </resources>
          EOF
          cp app/src/main/res/values/themes.xml app/src/main/res/values-night/themes.xml

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Next</string>
          </resources>
          EOF

          # 4. إنشاء خلفية الأيقونة (#232323)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#232323"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          # 5. إنشاء الرسمة الأمامية (المثلث المتموج بلونيه الأبيض والأزرق الرمادي)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:pivotX="57.5" android:pivotY="54"
                  android:scaleX="0.8" android:scaleY="0.8"
                  android:translateX="-2">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M 38,30.5 C 38,28.8 39.8,27.8 41.2,28.7 L 76.5,52.4 C 77.8,53.2 77.4,54.2 76.2,54.5 C 69.5,55.5 61.5,51.5 53,50.8 C 45.5,50.2 41,52.8 38,53.2 Z" />
              <path
                  android:fillColor="#8E9EAF"
                  android:pathData="M 38,56.8 C 41,56.2 45.5,53.8 53,54.4 C 61.5,55.2 69.5,59.0 76.2,56.2 L 41.2,79.2 C 39.8,80.2 38,79.2 38,77.5 Z" />
              </group>
          </vector>
          EOF

          # 6. إنشاء ملفات ربط الأيقونة التكيفية في كل المسارات المحتملة
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap/ic_launcher.xml
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap/ic_launcher_round.xml
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml

          # 7. التأكد من وجود ملف AndroidManifest.xml
          if [ -f "AndroidManifest.xml" ]; then
              cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # 8. مفتاح التوقيع
          if [ -f "flow.jks" ]; then
              cp flow.jks app/flow.jks
          else
              keytool -genkeypair -v -keystore app/flow.jks -alias flow -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass flowplayer2026 -keypass flowplayer2026 -dname "CN=FlowPlay, OU=App, O=Flow, L=City, S=State, C=US"
          fi

          # 9. ضبط إصدار جرادل المتوافق 8.11.1
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/*.apk Next.apk
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" Next.apk --title "Next $TAG" --notes "Release $TAG" || gh release upload "$TAG" Next.apk --clobber
